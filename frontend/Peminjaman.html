
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peminjaman Alat</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-black text-white flex">

  <nav class="w-56 min-h-screen border-r border-zinc-800 p-6 shrink-0">
    <h1 class="text-lg font-semibold mb-10">Peminjaman Alat</h1>

    <div class="flex flex-col gap-5 text-sm text-zinc-400">
      <a href="index.html" class="hover:text-white">Beranda</a>
      <a href="dashb.html" class="hover:text-white">Dashboard</a>
      <a href="peminjaman.html" class="text-white">Peminjaman</a>
    </div>
  </nav>

  <main class="flex-1 p-8 md:p-12">
    <p class="text-sm text-zinc-500 mb-2">Sistem Informasi Sekolah</p>
    <h2 class="text-3xl font-semibold mb-2">Peminjaman Alat</h2>
    <p class="text-sm text-zinc-400 mb-8">
      Isi formulir untuk mengajukan peminjaman alat praktik.
    </p>

    <div class="max-w-xl">
      <div id="alert-box" class="hidden"></div>

      <form id="form-peminjaman" class="space-y-5">

        <div>
          <label class="block text-sm mb-2">Nama Peminjam</label>
          <input type="text" id="nama_peminjam" required
            class="w-full bg-zinc-900 border border-zinc-700 p-3 outline-none focus:border-white"
            placeholder="Masukkan nama">
        </div>

        <div>
          <label class="block text-sm mb-2">Kelas</label>
          <input type="text" id="kelas" required
            class="w-full bg-zinc-900 border border-zinc-700 p-3 outline-none focus:border-white"
            placeholder="Contoh: XI RPL 1">
        </div>

        <div>
          <label class="block text-sm mb-2">Alat</label>
          <select id="pinjam_id_alat" required
            class="w-full bg-zinc-900 border border-zinc-700 p-3 outline-none focus:border-white">
            <option value="">Memuat daftar alat...</option>
          </select>
        </div>

        <div>
          <label class="block text-sm mb-2">Jumlah</label>
          <input type="number" id="jumlah" min="1" required
            class="w-full bg-zinc-900 border border-zinc-700 p-3 outline-none focus:border-white"
            placeholder="Jumlah alat">
        </div>

        <div>
          <label class="block text-sm mb-2">Tanggal Peminjaman</label>
          <input type="date" id="tanggal_pinjam" readonly
            class="w-full bg-zinc-900 border border-zinc-700 p-3 text-zinc-400">
        </div>

        <div>
          <label class="block text-sm mb-2">Rencana Pengembalian</label>
          <input type="date" id="tanggal_rencana_kembali" required
            class="w-full bg-zinc-900 border border-zinc-700 p-3 outline-none focus:border-white">
        </div>

        <button type="submit"
          class="bg-white text-black px-6 py-3 text-sm font-medium hover:bg-zinc-300">
          Ajukan Peminjaman
        </button>

      </form>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
